<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE ATHLETICS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="img/logo.png" alt="Logo" class="logo">

        <img src="img/basket.png" alt="Basket" class="basket">
        <img src="img/user.png" alt="User" class="user">
    </header>

    <section id="hero-section">
        <video autoplay muted loop id="hero-video">
            <source src="vid/hero-video.mp4" type="video/mp4">
        </video>
        <h1 id="hero-title">MADE FOR PROGRESS</h1>
    </section>

    <section id="produkt-section">
        <section id="produkt-1" class="produkt">
           <img src="img/core-black.svg" alt="Produkt 1" class="produkt-image">
            <h2 class="produkt-title-underline">
                Graphite black 
            </h2>
            <h2 class="produkt-title">
                Pulse Core Watch
            </h2>
            <button class="produkt-se-mere">
                SE MERE
            </button>
        </section>

        <section id="produkt-2" class="produkt">
            <img src="img/core-green.svg" alt="Produkt 2" class="produkt-image">
            <h2 class="produkt-title-underline">
                Forest green 
            </h2>
            <h2 class="produkt-title">
                Pulse Core Watch
            </h2>
             <button class="produkt-se-mere">
                SE MERE
            </button>
            
        </section>

        <section id="produkt-3" class="produkt">
            <img src="img/core-grey.svg" alt="Produkt 3" class="produkt-image">

                Steel grey 
            </h2>
            <h2 class="produkt-title">
                Pulse Core Watch
            </h2>
            <button class="produkt-se-mere">
                SE MERE
            </button>
        </section>

    </section>

        </div>

            </p>
        </div>

    <section id="app-mockup">

        <img src="img/app-mockup.png" alt="App Mockup" class="app-mockup-image">

    </section>

    <footer>

        <h2 id="footer-news"></h2>

        <div class="footer-newsletter">
            <input type="email" placeholder="Indtast din e-mail" class="footer-newsletter-input">
            <button class="footer-newsletter-button">Tilmeld</button>

    </footer>

    <script src="js/script.js"></script>
